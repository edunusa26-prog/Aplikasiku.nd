<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Admin — Aplikasiku.nd</title>
  <meta name="robots" content="noindex,nofollow">
  <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="hide-demo-pill">
  <div class="admin">
    <aside class="admin__side" id="a-side">
      <div class="admin__brand">
        <img src="assets/img/logo-mark.svg" data-brand-logo-admin alt="Logo Aplikasiku.nd">
        <div><b>Aplikasiku<i>.nd</i></b><span>Admin Panel</span></div>
      </div>
      <nav class="a-nav" id="a-nav" aria-label="Menu admin"></nav>
      <div class="a-side-foot">
        <div class="a-user">
          <div class="a-user__ava" id="a-user-ava">A</div>
          <div><b id="a-user-email">admin</b><span>Administrator</span></div>
        </div>
        <button class="a-nav__item" id="a-logout" style="width:100%"><i class="fa-solid fa-right-from-bracket"></i>Keluar</button>
      </div>
    </aside>
    <div class="admin__main">
      <header class="admin__top">
        <button class="a-burger" id="a-burger" aria-label="Menu"><i class="fa-solid fa-bars"></i></button>
        <h1 id="a-title">Dashboard</h1>
        <div class="a-top-actions">
          <span class="badge badge--demo" id="a-demo-tag" style="display:none"><i class="fa-solid fa-flask"></i> Mode Demo</span>
          <a class="btn btn--outline btn--sm" id="a-view-site" href="index.html" target="_blank"><i class="fa-solid fa-up-right-from-square"></i> Lihat Website</a>
        </div>
      </header>
      <div class="admin__content">
        <section class="a-section" id="sec-dashboard"></section>
        <section class="a-section" id="sec-aplikasi"></section>
        <section class="a-section" id="sec-kategori"></section>
        <section class="a-section" id="sec-prospek"></section>
        <section class="a-section" id="sec-konten"></section>
        <section class="a-section" id="sec-blog"></section>
        <section class="a-section" id="sec-pengaturan"></section>
      </div>
    </div>
  </div>
  <script src="js/config.js"></script>
  <script src="js/demo-data.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase.js" defer></script>
  <script src="js/app.js" defer></script>
  <script src="js/admin.js" defer></script>
</body>
</html>
